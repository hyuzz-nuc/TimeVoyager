<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c73e6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5c6bc0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3949ab;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#90caf9" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#90caf9" stroke-width="2" opacity="0.5"/>
  
  <!-- Clock face -->
  <circle cx="256" cy="256" r="120" fill="rgba(255,255,255,0.1)" stroke="#fff" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Hour markers -->
  <line x1="256" y1="150" x2="256" y2="165" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="347" x2="256" y2="362" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="256" x2="165" y2="256" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <line x1="347" y1="256" x2="362" y2="256" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="190" stroke="#fff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="256" y1="256" x2="310" y2="256" stroke="#90caf9" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#fff"/>
  <circle cx="256" cy="256" r="6" fill="#90caf9"/>
  
  <!-- Sparkles -->
  <path d="M380 120 L385 135 L400 135 L388 145 L393 160 L380 150 L367 160 L372 145 L360 135 L375 135 Z" fill="#90caf9" opacity="0.6"/>
  <path d="M100 350 L104 362 L116 362 L107 370 L111 382 L100 374 L89 382 L93 370 L84 362 L96 362 Z" fill="#90caf9" opacity="0.4"/>
</svg>
